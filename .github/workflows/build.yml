name: Build props
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Prop lines: cached = reuse this week's last pull (FREE), auto = live only if a pull is due (what scheduled runs do), live = new pull (~8 credits per game), sample = fake lines"
        type: choice
        options: [cached, auto, live, sample]
        default: cached
  schedule:
    # Hourly, 7am-9pm CT (UTC-6). GitHub's scheduler is best-effort (week 10: 3 of 11 scheduled runs started,
    # each 4-6h late), so every run checks whether a live pull is due (build.py --lines auto): no lines yet for
    # the week, lines 24h+ old, or a kickoff within 2h and lines 90+ min old. Most runs are free rebuilds that
    # still refresh stats, injuries and grading.
    - cron: "7 13-23 * * *"
    - cron: "7 0-3 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }   # NFL + NBA workflows share Pages; queue, don't cancel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Grade results and parlays
        # Free (no odds calls). Scores every finished week's snapshot and the saved-parlay sheet.
        # Runs on every build so a week is graded as soon as nflverse has its stats.
        env:
          # Saved parlays come back from the Apps Script web app as CSV (see docs/parlay-sheet.gs).
          # Same URL as PARLAY_WEBHOOK_URL in site/index.html; a secret/variable overrides it.
          PARLAY_SHEET_CSV_URL: ${{ secrets.PARLAY_SHEET_CSV_URL || vars.PARLAY_SHEET_CSV_URL || 'https://script.google.com/macros/s/AKfycbyYThKB9IKk3k2zNRmEU0E9JHwHVQfHZLlkGFQneNQNnPrxaJPWEYTO8BwwyT6PJ6wa9Q/exec?format=csv' }}
        run: python pipeline/build.py --grade
      - name: Build data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LINES_INPUT: ${{ inputs.lines }}
        run: |
          # Manual runs default to cached lines (free). Scheduled runs use auto (live only when a pull is due).
          # A live pull is skipped automatically (falls back to cached) if credits can't cover the slate.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${LINES_INPUT:-cached}"
          else
            MODE=auto
          fi
          echo "lines mode: $MODE"
          python pipeline/build.py --lines "$MODE"
      - name: Commit data
        run: |
          git config user.name "props-bot"; git config user.email "bot@users.noreply.github.com"
          # the board file is only committed when the lines changed (live pull); free rebuilds still deploy below
          git add site/data/results.json site/data/parlays.json site/data/history pipeline/lines_cache.json pipeline/backtest_cache.json
          [ -d site/data/diamonds ] && git add site/data/diamonds
          if [ "$(python -c "import json;print(json.load(open('site/data/props.json'))['mode'])")" = "live" ]; then git add site/data/props.json; fi
          git diff --cached --quiet || git commit -m "data: week $(python -c "import json;print(json.load(open('site/data/props.json'))['week'])") $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
      - name: Keep the other sport's live board
        # this run only rebuilt its own sport; don't roll the other board back to its last committed copy
        run: python pipeline/keep_live.py site/data/nba/props.json https://chrisnls.github.io/nfl-props/data/nba/props.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
