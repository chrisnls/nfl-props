name: Build props
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Prop lines: cached = reuse this week's last pull (FREE), live = new pull (~6 credits per game, ~85 for a full slate), sample = fake lines"
        type: choice
        options: [cached, live, sample]
        default: cached
  schedule:
    # Times are UTC; Central (CST) = UTC-6 for the rest of the season. Minutes are off the hour
    # because GitHub delays top-of-hour schedules most. Live pulls skip games that have already
    # kicked off, so later pulls in a day cost less. ~520 credits/week (~2,200/month).
    - cron: "7 15 * * 3"    # Wed  9:07am CT  first look once player props are posted
    - cron: "7 15 * * 4"    # Thu  9:07am CT  full refresh
    - cron: "37 23 * * 4"   # Thu  5:37pm CT  TNF, right before kickoff
    - cron: "7 14 * * 6"    # Sat  8:07am CT  after Friday's final injury reports
    - cron: "7 13 * * 0"    # Sun  7:07am CT  morning lines
    - cron: "7 16 * * 0"    # Sun 10:07am CT  morning line moves
    - cron: "17 17 * * 0"   # Sun 11:17am CT  after noon-game inactives (posted ~10:30)
    - cron: "37 20 * * 0"   # Sun  2:37pm CT  after late-game inactives (posted ~2:35)
    - cron: "37 0 * * 1"    # Sun  6:37pm CT  SNF (Mon 00:37 UTC)
    - cron: "37 23 * * 1"   # Mon  5:37pm CT  MNF
    - cron: "7 15 * * 2"    # Tue  9:07am CT  stats + grading only; cached lines, no credits
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Grade results and parlays
        # Free (no odds calls). Scores every finished week's snapshot and the saved-parlay sheet.
        # Runs on every build so a week is graded as soon as nflverse has its stats.
        env:
          # Saved parlays come back from the Apps Script web app as CSV (see docs/parlay-sheet.gs).
          # Same URL as PARLAY_WEBHOOK_URL in site/index.html; a secret/variable overrides it.
          PARLAY_SHEET_CSV_URL: ${{ secrets.PARLAY_SHEET_CSV_URL || vars.PARLAY_SHEET_CSV_URL || 'https://script.google.com/macros/s/AKfycbyYThKB9IKk3k2zNRmEU0E9JHwHVQfHZLlkGFQneNQNnPrxaJPWEYTO8BwwyT6PJ6wa9Q/exec?format=csv' }}
        run: python pipeline/build.py --grade
      - name: Build data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LINES_INPUT: ${{ inputs.lines }}
        run: |
          # Manual runs default to cached lines (free). Scheduled: Tue = cached, Thu/Sat/Sun = live.
          # A live pull is skipped automatically (falls back to cached) if credits can't cover the slate.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${LINES_INPUT:-cached}"
          elif [ "$(date -u +%u)" = "2" ]; then   # Tuesday UTC = the 9:07am CT grading run
            MODE=cached
          else
            MODE=live
          fi
          echo "lines mode: $MODE"
          python pipeline/build.py --lines "$MODE"
      - name: Commit data
        run: |
          git config user.name "props-bot"; git config user.email "bot@users.noreply.github.com"
          git add site/data/props.json site/data/results.json site/data/parlays.json site/data/history pipeline/lines_cache.json pipeline/backtest_cache.json
          git diff --cached --quiet || git commit -m "data: week $(python -c "import json;print(json.load(open('site/data/props.json'))['week'])") $(date -u +%F)"
          git pull --rebase origin main || true
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
