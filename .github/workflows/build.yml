name: Build props
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Prop lines: cached = reuse this week's last pull (FREE), live = new pull (~6 credits per game, ~85 for a full slate), sample = fake lines"
        type: choice
        options: [cached, live, sample]
        default: cached
  schedule:
    # Times are UTC. Central = UTC-6 (CST). Lines refreshed:
    - cron: "0 15 * * 4"   # Thu 9am CT  (TNF + early week lines)
    - cron: "0 14 * * 6"   # Sat 8am CT  (injury reports in)
    - cron: "0 13 * * 0"   # Sun 7am CT  (final lines + Sunday stats from Thu game)
    - cron: "0 15 * * 2"   # Tue 9am CT  (stats-only refresh after MNF; reuses cached lines, no credits)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Grade results and parlays
        # Free (no odds calls). Scores every finished week's snapshot and the saved-parlay sheet.
        # Runs on every build so a week is graded as soon as nflverse has its stats.
        env:
          PARLAY_SHEET_CSV_URL: ${{ secrets.PARLAY_SHEET_CSV_URL || vars.PARLAY_SHEET_CSV_URL }}
        run: python pipeline/build.py --grade
      - name: Build data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LINES_INPUT: ${{ inputs.lines }}
        run: |
          # Manual runs default to cached lines (free). Scheduled: Tue = cached, Thu/Sat/Sun = live.
          # A live pull is skipped automatically (falls back to cached) if credits can't cover the slate.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${LINES_INPUT:-cached}"
          elif [ "$(date -u +%u)" = "2" ]; then
            MODE=cached
          else
            MODE=live
          fi
          echo "lines mode: $MODE"
          python pipeline/build.py --lines "$MODE"
      - name: Commit data
        run: |
          git config user.name "props-bot"; git config user.email "bot@users.noreply.github.com"
          git add site/data/props.json site/data/results.json site/data/parlays.json site/data/history pipeline/lines_cache.json pipeline/backtest_cache.json
          git diff --cached --quiet || git commit -m "data: week $(python -c "import json;print(json.load(open('site/data/props.json'))['week'])") $(date -u +%F)"
          git pull --rebase origin main || true
          git push || echo "push skipped"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
