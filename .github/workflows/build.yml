name: Build props
on:
  workflow_dispatch:
  schedule:
    # Times are UTC. Central = UTC-6 (CST). Lines refreshed:
    - cron: "0 15 * * 4"   # Thu 9am CT  (TNF + early week lines)
    - cron: "0 14 * * 6"   # Sat 8am CT  (injury reports in)
    - cron: "0 13 * * 0"   # Sun 7am CT  (final lines + Sunday stats from Thu game)
    - cron: "0 15 * * 2"   # Tue 9am CT  (stats-only refresh after MNF; no odds credits used)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Build data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # Tuesday run: stats only, keep last week's lines out of the credit budget
          if [ "$(date -u +%u)" = "2" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            python pipeline/build.py --sample
          else
            python pipeline/build.py
          fi
      - name: Commit data
        run: |
          git config user.name "props-bot"; git config user.email "bot@users.noreply.github.com"
          git add site/data/props.json
          git diff --cached --quiet || git commit -m "data: week $(python -c "import json;print(json.load(open('site/data/props.json'))['week'])") $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
