name: Build NBA props
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Prop lines: cached = reuse today's last pull (FREE), auto = live only if a pull is due (what scheduled runs do), live = new pull (~7 credits per game), sample = fake lines"
        type: choice
        options: [cached, auto, live, sample]
        default: cached
  schedule:
    # Hourly, 8am-9pm CT (UTC-6). GitHub's scheduler is best-effort (runs arrive hours late or get dropped),
    # so instead of a few exact times every run checks whether a live pull is due (nba.py --lines auto):
    # no lines yet for the slate, lines 8h+ old, or a tip within 2h and lines 90+ min old. Most runs are free.
    - cron: "17 14-23 * * *"
    - cron: "17 0-3 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }   # shared with the NFL workflow; queue, don't cancel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Grade NBA results and parlays
        env:
          PARLAY_SHEET_CSV_URL: ${{ secrets.PARLAY_SHEET_CSV_URL || vars.PARLAY_SHEET_CSV_URL || 'https://script.google.com/macros/s/AKfycbyYThKB9IKk3k2zNRmEU0E9JHwHVQfHZLlkGFQneNQNnPrxaJPWEYTO8BwwyT6PJ6wa9Q/exec?format=csv' }}
        run: python pipeline/nba.py --grade
      - name: Build NBA data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LINES_INPUT: ${{ inputs.lines }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${LINES_INPUT:-cached}"; else MODE=auto; fi
          echo "lines mode: $MODE"
          python pipeline/nba.py --lines "$MODE"
      - name: Commit data
        run: |
          git config user.name "props-bot"; git config user.email "bot@users.noreply.github.com"
          # the board file is only committed when the lines changed (live pull); free rebuilds still deploy below
          for f in site/data/nba/history site/data/nba/diamonds site/data/nba/paper.json site/data/nba/results.json site/data/nba/parlays.json pipeline/nba_lines_cache.json pipeline/nba_backtest_cache.json; do [ -e "$f" ] && git add "$f"; done
          if [ "$(python -c "import json;print(json.load(open('site/data/nba/props.json'))['mode'])")" = "live" ]; then git add site/data/nba/props.json; fi
          git diff --cached --quiet || git commit -m "data: nba $(python -c "import json;print(json.load(open('site/data/nba/props.json'))['slate'])") $(date -u +%FT%H%MZ)"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped"
      - name: Keep the other sport's live board
        # this run only rebuilt its own sport; don't roll the other board back to its last committed copy
        run: python pipeline/keep_live.py site/data/props.json https://chrisnls.github.io/nfl-props/data/props.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
