<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Edge</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
:root{
  --bg:#0b0b0d; --panel:#141417; --panel2:#1b1b20; --line:#26262d;
  --ink:#f2efe6; --ink2:#b7b3a8; --ink3:#7d7a72;
  --gold:#d9b25c; --gold2:#f0d184; --gold-dim:rgba(217,178,92,.18);
  --good:#6fcf97; --bad:#e8716f; --warn:#f2b65c;
  --radius:12px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
a{color:var(--gold2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:14px 0 10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;letter-spacing:.02em}
.brand h1 span{color:var(--gold)}
.meta{color:var(--ink3);font-size:13px}
.banner{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(242,182,92,.12);border:1px solid rgba(242,182,92,.4);color:var(--warn);font-size:13px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:13px}
.chip.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim)}
.filters input[type=search]{flex:1;min-width:140px}

.board{margin-top:14px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) 80px 150px 110px 150px 70px;gap:10px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;text-align:left;width:100%}
.row:hover{border-color:#3a3a44;background:var(--panel2)}
.row.sel{border-color:var(--gold)}
.hdr{display:grid;grid-template-columns:minmax(0,1.6fr) 80px 150px 110px 150px 70px;gap:10px;padding:0 14px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--panel2);flex:none}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{color:var(--ink3);font-size:12px}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.03em}
.tag.inj{background:rgba(232,113,111,.15);color:var(--bad)}
.tag.q{background:rgba(242,182,92,.15);color:var(--warn)}
.tag.role{background:rgba(125,122,114,.2);color:var(--ink2)}
.row.demoted{opacity:.55}
.sig{color:var(--ink3);font-size:12px}
.str{display:block;font-family:var(--font);font-size:12px;font-weight:600;margin-top:1px}
.str.thin{color:var(--ink3);font-weight:400}
.why{font-size:13px;color:var(--ink2);margin-top:6px}
.why ul{margin:0;padding-left:18px}
.why li{margin:5px 0}
.why b{color:var(--ink)}
.why .verdict{margin:6px 0 8px;padding:10px 12px;border-radius:10px;background:var(--gold-dim);border:1px solid rgba(217,178,92,.35);color:var(--ink)}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block}
.pos{color:var(--good)} .neg{color:var(--bad)}
.side{font-weight:700;font-size:13px}
.hits{display:flex;gap:4px;align-items:flex-end}
.hits span{display:block;width:26px;text-align:center;font-size:11px;color:var(--ink3)}
.hits b{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:3px;position:relative;overflow:hidden}
.hits b i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px}
.add{padding:6px 0;border-radius:8px;border:1px solid var(--line);font-size:12px;text-align:center}
.add:hover{border-color:var(--gold);color:var(--gold2)}
.empty{color:var(--ink3);text-align:center;padding:40px}

/* detail drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;
  transform:translateX(100%);transition:transform .22s ease;overflow:auto;padding:18px 18px 100px}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none}
.scrim.open{display:block}
.drawer h2{margin:4px 0 2px;font-size:22px}
.drawer .sub{color:var(--ink2);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile .v{font-size:20px;font-weight:700;font-family:var(--mono)}
.sec{margin-top:18px;color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.chart{width:100%;height:190px;margin-top:6px}
.list{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
.list li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.list li b{color:var(--ink)}
.close{position:absolute;right:14px;top:12px;color:var(--ink3);font-size:22px}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn.gold{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.tip{position:fixed;pointer-events:none;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:30;font-family:var(--mono)}
table.log{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.log td,table.log th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
table.log th{color:var(--ink3);font-weight:500;font-size:11px;text-transform:uppercase}
table.log td:first-child,table.log th:first-child{text-align:left}

/* slip */
.slip{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;
  transform:translateY(calc(100% - 52px));transition:transform .22s}
.slip.open{transform:none}
.slip .bar{display:flex;justify-content:space-between;align-items:center;cursor:pointer;height:32px}
.slip .bar b{color:var(--gold2)}
.legs{max-width:1180px;margin:8px auto 0;display:grid;gap:6px}
.leg{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:13px}
.leg .x{color:var(--ink3);font-size:18px;padding:0 4px}
.sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px auto 0;max-width:1180px;font-size:13px;color:var(--ink2)}
.sum b{color:var(--ink);font-family:var(--mono)}
.corr{color:var(--warn);font-size:12px;margin-top:6px}

/* tabs + results/parlays views */
.sports{display:flex;gap:4px}
.sport{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:.06em;text-decoration:none}
.sport.on{border-color:var(--gold);color:#1a1405;background:var(--gold)}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{padding:8px 14px;color:var(--ink3);font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--gold2);border-bottom-color:var(--gold)}
[hidden]{display:none !important}
.view{margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.panel h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--ink3)} .small{font-size:12px}
.nc{text-transform:none}
code{font-family:var(--mono);font-size:12px;color:var(--gold2)}
.view table.log td:first-child{color:var(--ink)}
.calchart{width:100%;max-width:640px;height:auto;display:block}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;text-align:center;margin-right:6px}
.badge.won{background:rgba(111,207,151,.15);color:var(--good)}
.badge.lost{background:rgba(232,113,111,.15);color:var(--bad)}
.badge.push{background:var(--panel2);color:var(--ink2)}
.badge.pending{background:var(--gold-dim);color:var(--gold2)}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:8px 0}
.phead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px}
.pleg{display:flex;gap:6px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.pleg:last-child{border-bottom:0}
.pleg .pl{flex:1;min-width:0}
.chip.gold{border-color:var(--gold);color:#1a1405;background:var(--gold);font-weight:600}
.chip:disabled{opacity:.7;cursor:default}

@media (max-width:760px){
  header{position:static}
  .hdr{display:none}
  .row{grid-template-columns:1fr 1fr;gap:6px 10px;padding:10px 12px}
  .row .who{grid-column:1/-1}
  .row .add{grid-column:1/-1}
  .hits span{width:30px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Prop <span>Edge</span></h1>
      <nav class="sports" aria-label="Sport"><a class="sport" data-sport="nfl" href="?sport=nfl">NFL</a><a class="sport" data-sport="nba" href="?sport=nba">NBA</a></nav>
      <div class="meta" id="meta">loading…</div>
    </div>
    <div id="banner"></div>
    <nav class="tabs" role="tablist"><button class="tab on" data-tab="board">Board</button><button class="tab" data-tab="results">Results</button><button class="tab" data-tab="parlays">Parlays</button></nav>
    <div class="filters" data-view="board">
      <div class="chips" id="marketChips"></div>
      <select id="gameSel"><option value="">All games</option></select>
      <select id="sortSel">
        <option value="edge">Sort: strongest edge</option>
        <option value="ev">Sort: best EV</option>
        <option value="hit">Sort: hit rate L5</option>
        <option value="over">Sort: over edge</option>
        <option value="under">Sort: under edge</option>
        <option value="player">Sort: player</option>
      </select>
      <select id="sideSel" title="Only show props where the model leans this way"><option value="">Overs &amp; unders</option><option value="Over">Overs only</option><option value="Under">Unders only</option></select>
      <select id="minGames"><option value="3">3+ games</option><option value="5" selected>5+ games</option><option value="7">7+ games</option></select>
      <input type="search" id="q" placeholder="Search player or team">
    </div>
  </header>

  <div class="hdr" data-view="board"><span>Player · Market</span><span>Line</span><span title="Model's projection, how far it is from the line, and how strong that gap is given how much this player normally varies game to game">Model says</span><span>Model vs Book</span><span>Hit L5 · L10 · Szn</span><span></span></div>
  <div class="board" id="board" data-view="board"></div>
  <div class="view" id="resultsView" data-view="results" hidden></div>
  <div class="view" id="parlaysView" data-view="parlays" hidden></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="tip" id="tip"></div>

<div class="slip" id="slip">
  <div class="bar" id="slipBar"><span>Parlay slip · <b id="slipCount">0 legs</b></span><span id="slipOdds" class="num"></span></div>
  <div class="legs" id="legs"></div>
  <div class="sum" id="slipSum"></div>
  <div class="corr" id="corr"></div>
</div>

<script>
// ---- which sport: ?sport=nba (remembered); each sport has its own data folder and slip
const SPORT = (() => { const q = new URLSearchParams(location.search).get('sport');
  let s = q; if (!s) { try { s = localStorage.getItem('sport'); } catch (e) {} }
  s = s === 'nba' ? 'nba' : 'nfl'; try { localStorage.setItem('sport', s); } catch (e) {} return s; })();
const NBA = SPORT === 'nba';
const BASE = NBA ? 'data/nba/' : 'data/';
const SK = k => NBA ? k + '_nba' : k;              // localStorage keys per sport
const GL = g => NBA ? g.wk : 'Wk ' + g.wk;         // game label: "11/10" vs "Wk 8"
document.title = `Prop Edge — ${SPORT.toUpperCase()}`;
document.querySelectorAll('.sport').forEach(a => { a.classList.toggle('on', a.dataset.sport === SPORT);
  a.onclick = () => { a.href = '?sport=' + a.dataset.sport + location.hash; }; });

// Google Apps Script web-app URL for saving parlays (see README → Saved parlays). Empty = saving off.
const PARLAY_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyYThKB9IKk3k2zNRmEU0E9JHwHVQfHZLlkGFQneNQNnPrxaJPWEYTO8BwwyT6PJ6wa9Q/exec';

const $ = s => document.querySelector(s);
const fmtOdds = o => o == null ? '—' : (o > 0 ? '+' + o : '' + o);
const pct = p => p == null ? '—' : Math.round(p * 100) + '%';
const dec = o => o > 0 ? 1 + o / 100 : 1 + 100 / -o;
const BOOK = {draftkings:'DK',fanduel:'FD',betmgm:'MGM',caesars:'CZR',espnbet:'ESPN',fanatics:'FAN',sample:'sample'};

// nflverse kickoff times are US Eastern wall-clock ("2026-11-08T13:00"); convert to a real
// instant so it displays in the viewer's own time zone.
function kickoffDate(s){
  const guess = new Date(s + ':00Z');
  const asNY = new Date(guess.toLocaleString('en-US', {timeZone:'America/New_York'}));
  const asUTC = new Date(guess.toLocaleString('en-US', {timeZone:'UTC'}));
  return new Date(guess.getTime() + (asUTC - asNY));
}
const kickoffText = s => { const t = kickoffDate(s);
  return t.toLocaleDateString([], {weekday:'short', month:'numeric', day:'numeric'}) + ' · ' + t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
let KICK = {};

let DATA, props = [], state = {markets:new Set(), game:'', sort:'edge', min:5, q:'', sel:null, side:''};
// remember the over/under choice between visits
try { state.side = localStorage.getItem('side') || ''; } catch (e) {}
let slip = JSON.parse(localStorage.getItem(SK('slip')) || '[]');

async function load(){
  const r = await fetch(BASE + 'props.json?v=' + Date.now());
  DATA = await r.json();
  props = DATA.props;
  const gen = new Date(DATA.generated);
  $('#meta').textContent = `${NBA ? DATA.week : 'Week ' + DATA.week} · stats thru ${NBA ? '' : 'wk '}${DATA.stats_through_week} · lines ${new Date(DATA.lines_fetched || DATA.generated).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}` +
    (DATA.mode === 'cached' ? ` (reused · stats updated ${gen.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})})` : '') +
    (DATA.usage && DATA.usage.remaining ? ` · ${DATA.usage.remaining} API credits left` : '');
  if (DATA.mode === 'sample') $('#banner').innerHTML = `<div class="banner"><b>Sample lines.</b> No Odds API key is configured, so each line is set at the player's recent average. Projections and hit rates are real; edges are not.</div>`;
  const mk = $('#marketChips');
  for (const [k, label] of Object.entries(DATA.markets)) {
    const b = document.createElement('button'); b.className = 'chip on'; b.textContent = label; b.dataset.k = k;
    state.markets.add(k);
    b.onclick = () => { b.classList.toggle('on'); b.classList.contains('on') ? state.markets.add(k) : state.markets.delete(k); render(); };
    mk.appendChild(b);
  }
  KICK = Object.fromEntries(DATA.games.map(g => [g.id, g.kickoff]));
  const gs = $('#gameSel');
  for (const g of DATA.games.filter(g => !g.played)) {
    const o = document.createElement('option'); o.value = g.id;
    o.textContent = `${g.away} @ ${g.home} · ${kickoffText(g.kickoff)}`;
    gs.appendChild(o);
  }
  gs.onchange = e => { state.game = e.target.value; render(); };
  $('#sortSel').onchange = e => { state.sort = e.target.value; render(); };
  $('#sideSel').value = state.side;
  $('#sideSel').onchange = e => { state.side = e.target.value; try { localStorage.setItem('side', state.side); } catch (err) {} render(); };
  $('#minGames').onchange = e => { state.min = +e.target.value; render(); };
  $('#q').oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
  render(); renderSlip();
  showTab(location.hash.slice(1));
}

const esd = p => p.edge_sd ?? p.edge / p.sd;
// Plain-English strength of the edge: the gap vs the line, measured against the player's
// normal game-to-game swing (σ). ~1 swing = strong; under a third of a swing = noise.
const strength = p => { const a = Math.abs(esd(p)); return a >= 1 ? 'Strong' : a >= 0.6 ? 'Solid' : a >= 0.3 ? 'Lean' : 'Thin'; };
const gapText = p => p.edge === 0 ? 'right on the line' : `${Math.abs(p.edge)} ${p.edge > 0 ? 'over' : 'under'} the line`;
const strTip = p => `Projection is ${gapText(p)}. That gap is ${Math.abs(esd(p)).toFixed(1)}× this player's normal game-to-game swing (σ ${p.sd}). Strong ≥ 1×, Solid ≥ 0.6×, Lean ≥ 0.3×, Thin below that.`;
const isThin = p => p.role_change && p.role_change.why === 'thin';
const INJ_ABBR = {'out':'OUT', 'doubtful':'DBT', 'questionable':'Q', 'day-to-day':'GTD', 'probable':'P', 'suspension':'SUSP'};
const injAbbr = st => INJ_ABBR[String(st).toLowerCase()] || String(st)[0];
const injCls = st => /questionable|day-to-day|probable/i.test(st) ? 'q' : 'inj';
const roleWhy = r => r.why === 'injury'
  ? `Listed ${r.status}${r.injury_type ? ' (' + r.injury_type + ')' : ''} on the injury report. If he sits, this prop is voided; if the line is still up, it's likely stale`
  : r.why === 'minutes'
  ? `The book's ${r.ref} line implies about ${r.implied_min} minutes; the model projects ${r.proj_min}. Books move like this on playing-time news (a minutes limit lifting, a starter back or out) the box scores don't show yet`
  : r.why === 'thin'
  ? `Only ${r.games} game${r.games === 1 ? '' : 's'} this season — too few to project, so this prop isn't rated`
  : r.why === 'usage'
  ? `${r.metric === 'minutes' ? `Minutes went from ${r.snap_prior} to ${r.snap_recent} a game` : `Snap share went from ${r.snap_prior}% to ${r.snap_recent}%`} over the last 2 games — the season-long game log the model uses hasn't caught up`
  : `Line is ${Math.abs(r.z)}σ ${r.dir === 'up' ? 'above' : 'below'} the player's season average — likely a role change the game log can't see`;
const roleTag = p => !p.role_change ? '' : p.role_change.why === 'injury' ? '' : isThin(p)
  ? `<span class="tag role" title="${roleWhy(p.role_change)}">Thin history · ${p.role_change.games} g</span>`
  : `<span class="tag role" title="${roleWhy(p.role_change)}">Role ${p.role_change.dir === 'up' ? '↑' : '↓'}</span>`;

function bestSide(p){
  // which side the model likes, and that side's EV
  const over = p.edge > 0;
  return {side: over ? 'Over' : 'Under', ev: over ? p.ev_over : p.ev_under, price: over ? p.over : p.under, book: over ? p.over_book : p.under_book, p: over ? p.p_over : 1 - p.p_over};
}

function render(){
  let list = props.filter(p => state.markets.has(p.market) && (!state.side || bestSide(p).side === state.side) && (!state.game || p.game === state.game) && (p.games.length >= state.min || isThin(p)) &&
    (!state.q || (p.player + ' ' + p.team + ' ' + p.opp).toLowerCase().includes(state.q)));
  const key = {
    edge: p => -Math.abs(esd(p)), ev: p => -(bestSide(p).ev ?? -9), hit: p => -(p.hit_l5 ?? 0),
    over: p => -esd(p), under: p => esd(p), player: p => 0,
  }[state.sort];
  // role-change props sink below everything else (except in the alphabetical view)
  const demote = p => state.sort !== 'player' && p.role_change ? 1 : 0;
  list.sort((a, b) => demote(a) - demote(b) || key(a) - key(b) || a.player.localeCompare(b.player));
  const board = $('#board'); board.innerHTML = '';
  if (!list.length) { board.innerHTML = '<div class="empty">No props match.</div>'; return; }
  // cap the main board at 300, but always show the (few) demoted role-change props under a divider
  const main = list.filter(p => !demote(p)).slice(0, 300), sunk = list.filter(demote);
  for (const p of [...main, ...sunk]) {
    if (p === sunk[0]) { const h = document.createElement('div'); h.className = 'sec'; h.textContent = `Demoted · ${sunk.length} — possible role change (line far from history, or playing time just shifted), ${NBA ? 'listed out/doubtful, ' : ''}or thin history (under 3 games, not rated)`; board.appendChild(h); }
    const bs = bestSide(p);
    const inj = p.injury && p.injury.status ? `<span class="tag ${injCls(p.injury.status)}" title="${p.injury.note ? p.injury.note.replace(/"/g, '&quot;') : p.injury.status}">${injAbbr(p.injury.status)}${p.injury.injury ? ' · ' + p.injury.injury : ''}</span>` : '';
    const el = document.createElement('div'); el.className = 'row' + (p.role_change ? ' demoted' : '') + (state.sel === p.id ? ' sel' : ''); el.setAttribute('role','button'); el.tabIndex = 0;
    el.innerHTML = `
      <div class="who">${p.headshot ? `<img src="${p.headshot}" alt="" loading="lazy">` : '<span style="width:40px"></span>'}
        <div style="min-width:0"><div class="n">${p.player} <span style="color:var(--ink3);font-weight:400">· ${p.label}</span></div>
        <div class="s">${p.pos} ${p.team} ${p.home ? 'vs' : '@'} ${p.opp}${KICK[p.game] ? ` · ${kickoffText(KICK[p.game])}` : ''} ${roleTag(p)} ${inj}</div></div></div>
      <div class="num"><span class="k">Line</span>${p.line}</div>
      ${isThin(p) ? `<div class="num" title="${roleWhy(p.role_change)}"><span class="k">Avg</span>${p.avg_season} <span class="sig" style="white-space:nowrap">in ${p.games.length} game${p.games.length === 1 ? '' : 's'}</span>
        <span class="str thin">Not rated</span></div>
      <div><span class="k">Over ${fmtOdds(p.over)} · Under ${fmtOdds(p.under)}</span>
        <span class="num" style="color:var(--ink3);font-size:12px">book ${pct(p.fair_over)} over</span></div>`
      : `<div class="num" title="${strTip(p)}"><span class="k">Proj</span>${p.proj} <span class="sig" style="white-space:nowrap">${gapText(p)}</span>
        <span class="str ${strength(p) === 'Thin' ? 'thin' : p.edge >= 0 ? 'pos' : 'neg'}">${strength(p)} ${strength(p) === 'Thin' ? 'edge' : p.edge >= 0 ? 'over' : 'under'}</span></div>
      <div><span class="k">${bs.side} ${fmtOdds(bs.price)} ${bs.book ? BOOK[bs.book] || bs.book : ''}</span>
        <span class="num side ${bs.ev > 0 ? 'pos' : ''}">${pct(bs.p)}</span> <span class="num" style="color:var(--ink3);font-size:12px">vs ${pct(bs.side === 'Over' ? p.fair_over : 1 - p.fair_over)}</span></div>`}
      <div class="hits">${[['L5', p.hit_l5], ['L10', p.hit_l10], ['Szn', p.hit_season]].map(([l, v]) => `<span><b><i style="width:${v ?? 0}%"></i></b>${v == null ? '—' : v + '%'}</span>`).join('')}</div>
      <button class="add" data-id="${p.id}">${isThin(p) ? 'Pick side' : '+ ' + bs.side}</button>`;
    el.onclick = e => { if (e.target.closest('.add') && !isThin(p)) { addLeg(p, bs.side); } else openDetail(p); };
    el.onkeydown = e => { if (e.key === 'Enter') openDetail(p); };
    board.appendChild(el);
  }
}

// ---- analysis: why recent games landed where they did, and a deep look at the defense
const fmt = x => x == null || isNaN(x) ? '—' : (+x).toFixed(1).replace(/\.0$/, '');
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const GRP = {QB:'QBs', RB:'RBs', WR:'WRs', TE:'TEs', G:'guards', F:'forwards', C:'centers'};
const KIND = m => NBA ? 'nba' : /rush/.test(m) ? 'rush' : /pass/.test(m) ? 'pass' : 'rec';
// efficiency = stat per unit of volume; skip where the stat *is* the volume (carries) or too sparse (pass TDs)
const EFF = {player_points:['points per 36 min', 36], player_rebounds:['rebounds per 36 min', 36], player_assists:['assists per 36 min', 36],
             player_threes:['3s per 36 min', 36], player_points_rebounds_assists:['PRA per 36 min', 36],
             player_rush_yds:['yards per carry', 1], player_reception_yds:['yards per target', 1],
             player_pass_yds:['yards per attempt', 1], player_receptions:['catch rate', 100]};
const VOLNAME = {car:'Carries', tgt:'Targets', att:'Pass attempts', min:'Minutes'};
const sumOf = (a, f) => a.reduce((s, g) => s + (f(g) ?? 0), 0);
const avgOf = (a, f) => { const v = a.map(f).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const pctChg = (a, b) => b ? Math.round(100 * (a - b) / b) : null;
const scoreTxt = (us, them) => us == null || them == null ? '' : `${us > them ? 'won' : us < them ? 'lost' : 'tied'} ${Math.max(us, them)}–${Math.min(us, them)}`;

function whyRecent(p){
  const G = p.games;
  if (G.length < 4) return '';
  const rec = G.slice(-2), base = G.slice(0, -2);
  const under = rec.filter(g => g.val < p.line).length, over = rec.length - under;
  const title = under === 2 ? 'Why the last 2 games went under' : over === 2 ? 'Why the last 2 games went over' : 'Last 2 games, explained';
  const dir = under === 2 ? -1 : over === 2 ? 1 : 0;
  const bVol = avgOf(base, g => g.vol), rVol = avgOf(rec, g => g.vol);
  const bSnap = avgOf(base, g => g.snap), rSnap = avgOf(rec, g => g.snap);
  const eff = EFF[p.market];
  const effOf = a => { const v = sumOf(a, g => g.vol); return v ? eff[1] * sumOf(a, g => g.val) / v : null; };
  const bEff = eff ? effOf(base) : null, rEff = eff ? effOf(rec) : null;
  const vn = VOLNAME[p.vol_label] || 'Volume';
  const pts = [];

  // per-game result line
  pts.push(rec.map(g => `${GL(g)} ${g.home ? 'vs' : '@'} ${g.opp}: <b>${fmt(g.val)}</b> (${g.val >= p.line ? '+' : ''}${fmt(g.val - p.line)} vs ${p.line})` +
    (g.vol != null ? ` on ${g.vol} ${p.vol_label}` : '') + (g.snap != null ? `, ${g.snap}% of snaps` : '')).join('<br>'));

  // volume
  let volLog = 0, effLog = 0;
  if (bVol && rVol != null) {
    const c = pctChg(rVol, bVol);
    volLog = rVol > 0 ? Math.log(rVol / bVol) : -2;
    if (c != null) pts.push(`<b>${vn}:</b> ${fmt(rVol)} per game in the last 2, vs ${fmt(bVol)} before (${c > 0 ? '+' : ''}${c}%).`);
  }
  if (bSnap != null && rSnap != null) {
    const d = Math.round(rSnap - bSnap);
    pts.push(`<b>Snap share:</b> ${Math.round(rSnap)}% in the last 2, vs ${Math.round(bSnap)}% before${Math.abs(d) >= 10 ? ` — a ${d > 0 ? 'big jump' : 'big drop'} in playing time` : ''}.`);
  }
  if (eff && bEff && rEff != null) {
    const c = pctChg(rEff, bEff);
    effLog = rEff > 0 ? Math.log(rEff / bEff) : -2;
    const u = eff[1] === 100 ? '%' : '';
    pts.push(`<b>${eff[0][0].toUpperCase() + eff[0].slice(1)}:</b> ${fmt(rEff)}${u} in the last 2, vs ${fmt(bEff)}${u} before (${c > 0 ? '+' : ''}${c}%).`);
  }
  // teammate taking (or ceding) work
  const takers = rec.filter(g => g.mate && g.vol != null && g.mate.vol > g.vol);
  if (takers.length) {
    const nm = takers[takers.length - 1].mate.name;
    const before = avgOf(base, g => g.mate && g.mate.name === nm ? g.mate.vol : 0);
    pts.push(`<b>${nm}</b> out-${p.vol_label === 'car' ? 'carried' : p.vol_label === 'tgt' ? 'targeted' : 'threw'} him: ` +
      takers.map(g => `${g.mate.vol}–${g.vol}${g.mate.snap != null ? ` (${g.mate.snap}% snaps)` : ''}`).join(', ') +
      ` after averaging ${fmt(before)} ${p.vol_label} in the earlier games.`);
  }
  // game script
  const kind = KIND(p.market);
  const margins = rec.map(g => g.pts != null && g.opp_pts != null ? g.pts - g.opp_pts : null);
  if (margins.every(m => m != null)) {
    const sc = rec.map(g => scoreTxt(g.pts, g.opp_pts)).join(', ');
    const bigWin = margins.filter(m => m >= 14).length, bigLoss = margins.filter(m => m <= -14).length;
    let note;
    if (kind === 'nba') { const big = margins.filter(m => Math.abs(m) >= 18).length;
      note = big ? `A blowout (18+ points) usually means starters sit the 4th quarter, which cuts minutes and counting stats.` : `No blowouts, so garbage time doesn't explain it.`; }
    else if (kind === 'rush') note = bigLoss ? `Trailing big pushes teams to pass, which cuts carries.` :
      margins.every(m => m > 0) ? `Leading usually means <i>more</i> running, so game script doesn't explain ${dir < 0 ? 'the misses' : 'it'}.` : `Close games — no strong game-script effect.`;
    else note = bigWin ? `A comfortable lead usually means less passing late.` :
      bigLoss ? `Playing from behind usually means more passing.` : `Close games — no strong game-script effect.`;
    pts.push(`<b>Game script:</b> ${p.team} ${sc}. ${note}`);
  }
  // verdict
  let verdict = '';
  if (dir !== 0 && (volLog || effLog)) {
    const byVol = Math.abs(volLog) >= Math.abs(effLog);
    const word = dir < 0 ? 'down' : 'up';
    verdict = byVol
      ? `<b>Mostly a volume story</b> — his workload went ${word}${takers.length && dir < 0 ? ' as ' + takers[takers.length - 1].mate.name + ' took over' : ''}. Volume changes tend to stick (they come from the coaches), and the model still averages in his earlier games, so it probably ${dir < 0 ? 'overrates' : 'underrates'} him right now.`
      : `<b>Mostly an efficiency story</b> — his workload was normal but he did ${dir < 0 ? 'less' : 'more'} with it. Per-play efficiency bounces around a lot from game to game, so this is more likely to be noise than a lasting change.`;
  }
  return `<div class="sec">${title}</div><div class="why">${verdict ? `<p class="verdict">${verdict}</p>` : ''}<ul>${pts.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
}

function defenseDive(p){
  const d = DATA.defense && DATA.defense[p.defense];
  if (!d) return '';
  const grp = GRP[d.grp] || d.grp, vl = d.vol_label, cnt = !NBA && /Receptions|TDs|Att/.test(p.label);
  const perVol = x => x == null ? '—' : vl === 'tgt' && p.label === 'Receptions' ? Math.round(x * 100) + '%' : fmt(x);
  const perVolName = p.label === 'Receptions' ? 'catch rate allowed' : vl === 'min' ? 'per 36 minutes' : `per ${{car:'carry', tgt:'target', att:'attempt'}[vl]}`;
  const games = d.games;
  // outliers: games well above their typical game
  const big = games.filter(g => g.val >= 1.5 * d.median && g.val > d.lg_avg && games.length >= 4);
  const rest = games.filter(g => !big.includes(g));
  const restAvg = avgOf(rest, g => g.val), restVol = sumOf(rest, g => g.vol);
  const restPer = restVol ? sumOf(rest, g => g.val) / restVol : null;
  const skew = big.length && d.avg > 1.2 * d.median;
  const g0 = DATA.games.find(g => g.id === p.game);
  let matchup = '';
  if (g0 && g0.spread != null) {
    const homeFav = g0.spread > 0, fav = g0.spread === 0 ? null : homeFav ? g0.home : g0.away;
    const ours = fav === p.team;
    const kind = KIND(p.market);
    const effect = !fav ? '' : kind === 'rush' ? (ours ? 'Favorites tend to run more — a mild plus for rushing volume.' : 'Underdogs tend to fall behind and pass more — a mild minus for rushing volume.')
      : (ours ? 'Favorites tend to pass a bit less late in games.' : 'Underdogs tend to pass more to catch up — a mild plus for passing volume.');
    matchup = `<li><b>This game:</b> ${fav ? `${fav} favored by ${Math.abs(g0.spread)}` : 'pick’em'}, total ${g0.total}. ${effect}</li>`;
  }
  const medRatio = d.lg_median ? Math.round(100 * d.median / d.lg_median) : null;
  const notes = [
    `<li><b>Season:</b> allows the <b>${ord(d.rank)}-most</b> ${p.label.toLowerCase()} to ${grp} of ${d.n_teams} teams — ${fmt(d.avg)} per game vs a league average of ${fmt(d.lg_avg)}.</li>`,
    skew ? `<li><b>But the average is skewed.</b> ${big.map(g => `${GL(g)} vs ${g.vs}: ${fmt(g.val)}${g.vol != null ? ` on ${g.vol} ${vl}` : ''}${g.def_pts != null ? ` (${d.team} ${scoreTxt(g.def_pts, g.off_pts)})` : ''}`).join('; ')}. ` +
      `In their other ${rest.length} games they allowed <b>${fmt(restAvg)}</b> per game${restPer != null && !cnt ? ` at ${fmt(restPer)} ${perVolName}` : ''}. ` +
      `${big.some(g => g.def_pts != null && g.def_pts < g.off_pts - 13) && KIND(p.market) === 'rush' ? 'Teams with a big lead run the ball to burn clock, which inflates rushing allowed.' : ''}</li>` : '',
    `<li><b>Typical game (median):</b> ${fmt(d.median)} vs league ${fmt(d.lg_median)}${medRatio != null ? ` — ${medRatio}% of league` : ''}.</li>`,
    !cnt || p.label === 'Receptions' ? `<li><b>Efficiency:</b> ${perVol(d.per_vol)} ${perVolName} vs league ${perVol(d.lg_per_vol)}; faces ${fmt(d.vol_avg)} ${vl} per game (league ${fmt(d.lg_vol_avg)}).</li>` : '',
    `<li><b>Last 3 games:</b> ${fmt(d.l3)} per game (${games.slice(-3).map(g => `${g.vs} ${fmt(g.val)}`).join(', ')}).</li>`,
    matchup,
    `<li><b>What the model used:</b> ${p.def_basis === 'mean' ? 'average' : p.def_basis === 'per-minute' ? 'per-minute' : 'typical-game (median)'} allowed = ${Math.round(p.def_factor * 100)}% of league, half-weighted and capped at ±20%, so it moved the projection ${p.def_factor >= 1 ? 'up' : 'down'} ${Math.round(Math.abs(Math.max(-0.2, Math.min(0.2, p.def_factor - 1))) * 50)}%.${skew && p.def_basis === 'median' ? ' Because it uses the median, the blowouts above don’t inflate it.' : p.def_basis === 'per-minute' ? ' Per minute, so how many minutes that position group logged doesn’t skew it.' : ''}</li>`,
  ].join('');
  const rows = [...games].reverse().map(g => `<tr><td>${g.wk}</td><td>${g.vs}</td><td class="num">${fmt(g.val)}</td>` +
    `<td class="num">${g.vol ?? '—'}</td><td style="text-align:left">${g.top ? `${g.top} <span style="color:var(--ink3)">${fmt(g.top_val)}${g.top_vol != null ? '/' + g.top_vol : ''}</span>` : '—'}</td>` +
    `<td style="text-align:left" class="${g.def_pts > g.off_pts ? 'pos' : g.def_pts < g.off_pts ? 'neg' : ''}">${g.def_pts != null ? `${g.def_pts > g.off_pts ? 'W' : g.def_pts < g.off_pts ? 'L' : 'T'} ${g.def_pts}–${g.off_pts}` : ''}</td></tr>`).join('');
  return `<div class="sec">${d.team} defense vs ${grp} · ${p.label}</div>
    <div class="why"><ul>${notes}</ul></div>
    <table class="log"><tr><th>${NBA ? 'Date' : 'Wk'}</th><th>Opp</th><th>${grp}</th><th>${vl}</th><th style="text-align:left">Top ${d.grp}</th><th style="text-align:left">${d.team} result</th></tr>${rows}</table>`;
}

function openDetail(p){
  state.sel = p.id;
  const d = $('#drawer'); const bs = bestSide(p);
  const games = p.games;
  const max = Math.max(p.line * 1.3, ...games.map(g => g.val)) || 1;
  const W = 520, H = 190, padL = 30, padB = 26, padT = 10;
  const bw = (W - padL) / games.length;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const bars = games.map((g, i) => {
    const hit = g.val > p.line; const x = padL + i * bw + 3; const w = Math.max(6, bw - 6);
    const top = y(g.val), h = Math.max(0, H - padB - top);
    return `<g class="bar" data-i="${i}"><rect x="${x}" y="${top}" width="${w}" height="${h}" rx="4" fill="${hit ? 'var(--gold)' : '#4a4a58'}"/>
      <text x="${x + w/2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--ink3)">${g.opp}</text>
      <rect x="${x - 3}" y="0" width="${bw}" height="${H}" fill="transparent"/></g>`;
  }).join('');
  const inj = p.injury && p.injury.status ? `<span class="tag ${p.injury.status === 'Questionable' ? 'q' : 'inj'}">${p.injury.status} · ${p.injury.injury || ''}</span>` : (p.injury && p.injury.practice && /Did Not|Limited/.test(p.injury.practice) ? `<span class="tag q">${p.injury.practice.replace(' In Practice','').replace(' in Practice','')}</span>` : '');
  d.innerHTML = `
    <button class="close" id="close" aria-label="close">×</button>
    <div class="who">${p.headshot ? `<img src="${p.headshot}" alt="" style="width:56px;height:56px">` : ''}
      <div><h2>${p.player}</h2><div class="sub">${p.pos} · ${p.team} ${p.home ? 'vs' : '@'} ${p.opp}${KICK[p.game] ? ` · ${kickoffText(KICK[p.game])}` : ''} · ${p.label} ${roleTag(p)} ${inj}</div></div></div>
    ${p.role_change && p.role_change.why === 'usage' ? `<div class="note"><b>Possible role change.</b> His ${p.role_change.metric === 'minutes' ? 'minutes' : 'snap share'} went from ${p.role_change.snap_prior}${p.role_change.metric === 'minutes' ? '' : '%'} to ${p.role_change.snap_recent}${p.role_change.metric === 'minutes' ? ' a game' : '%'} over the last 2 games, but the model still projects off his whole season, so it leans ${p.edge > 0 ? 'over' : 'under'} while his playing time points the other way. Demoted to the bottom of the board — see the breakdown below.</div>` : ''}
    ${isThin(p) ? `<div class="note"><b>Thin history — not rated.</b> ${p.player} has only ${p.role_change.games} game${p.role_change.games === 1 ? '' : 's'} this season (${p.games.map(g => `wk ${g.wk}: ${g.val}`).join(', ')}). That's too few to project honestly — the numbers below are just his average and its spread, not a real forecast. Often this is a backup stepping in for an injured starter, so the book's line reflects a role his games don't show.</div>` : ''}
    ${p.role_change && p.role_change.why === 'injury' ? `<div class="note"><b>On the injury report: ${p.role_change.status}.</b> ${p.injury && p.injury.note ? p.injury.note + ' ' : ''}${p.injury && p.injury.return ? `Estimated return ${p.injury.return}. ` : ''}Books usually pull these lines; if this one is still up, the model can't price a player who may not play. Demoted to the bottom of the board.</div>` : ''}
    ${p.role_change && p.role_change.why === 'minutes' ? `<div class="note"><b>Playing time doesn't match.</b> ${roleWhy(p.role_change)}. The model projects off recent minutes, so its edge here is probably stale. Check the news. Demoted to the bottom of the board, along with his other props.</div>` : ''}
    ${p.role_change && !['usage', 'thin', 'minutes', 'injury'].includes(p.role_change.why) ? `<div class="note"><b>Possible role change.</b> The line (${p.line}) is ${Math.abs(p.role_change.z)}σ ${p.role_change.dir === 'up' ? 'above' : 'below'} the player's season average of ${p.avg_season} (range ${p.role_change.lo}–${p.role_change.hi}). Books usually move this far only on news — a starter out, a depth-chart change — that the game log doesn't reflect yet, so the edge here is likely the model being stale. Demoted to the bottom of the board.</div>` : ''}
    <div class="grid">
      <div class="tile"><span class="k">Line</span><div class="v">${p.line}</div><div class="meta">${p.books.length > 1 ? p.books.length + ' books' : (BOOK[p.books[0]] || '')}${p.line_spread ? ' · ±' + p.line_spread : ''}</div></div>
      ${isThin(p) ? `<div class="tile"><span class="k">Average</span><div class="v">${p.avg_season}</div><div class="meta">${p.games.length} game${p.games.length === 1 ? '' : 's'} · no projection</div></div>`
        : `<div class="tile"><span class="k">Projection</span><div class="v">${p.proj}</div><div class="meta">σ ${p.sd}</div></div>`}
      ${isThin(p) ? '' : `<div class="tile"><span class="k">Edge</span><div class="v ${p.edge >= 0 ? 'pos' : 'neg'}">${p.edge > 0 ? '+' : ''}${p.edge}</div><div class="meta" title="${strTip(p)}">${isThin(p) ? 'not rated · too few games' : `${strength(p)} · ${Math.abs(esd(p)).toFixed(1)}× normal swing`}</div></div>`}
      <div class="tile"><span class="k">P(over)</span><div class="v">${isThin(p) ? '—' : pct(p.p_over)}</div><div class="meta">book ${pct(p.fair_over)}</div></div>
      <div class="tile"><span class="k">Over</span><div class="v">${fmtOdds(p.over)}</div><div class="meta">${BOOK[p.over_book] || ''} · EV ${p.ev_over == null || isThin(p) ? '—' : (p.ev_over * 100).toFixed(1) + '%'}</div></div>
      <div class="tile"><span class="k">Under</span><div class="v">${fmtOdds(p.under)}</div><div class="meta">${BOOK[p.under_book] || ''} · EV ${p.ev_under == null || isThin(p) ? '—' : (p.ev_under * 100).toFixed(1) + '%'}</div></div>
    </div>
    <div class="btns"><button class="btn ${bs.side === 'Over' && !isThin(p) ? 'gold' : ''}" id="addO">Add Over ${p.line}</button><button class="btn ${bs.side === 'Under' && !isThin(p) ? 'gold' : ''}" id="addU">Add Under ${p.line}</button></div>

    <div class="sec">Game log vs line · gold = over</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" id="chart">
      <line x1="${padL}" x2="${W}" y1="${y(p.line)}" y2="${y(p.line)}" stroke="var(--ink2)" stroke-dasharray="4 4"/>
      <text x="0" y="${y(p.line) + 4}" font-size="11" fill="var(--ink2)">${p.line}</text>
      <line x1="${padL}" x2="${W}" y1="${y(p.avg_season)}" y2="${y(p.avg_season)}" stroke="var(--gold)" opacity=".35"/>
      ${bars}
    </svg>
    <div class="grid">
      <div class="tile"><span class="k">L5 avg</span><div class="v">${p.avg_l5}</div></div>
      <div class="tile"><span class="k">L10 avg</span><div class="v">${p.avg_l10}</div></div>
      <div class="tile"><span class="k">Season</span><div class="v">${p.avg_season}</div><div class="meta">median ${p.median}</div></div>
      <div class="tile"><span class="k">${p.opp} D vs ${p.pos}</span><div class="v ${p.def_factor > 1.05 ? 'pos' : p.def_factor < 0.95 ? 'neg' : ''}">${Math.round(p.def_factor * 100)}%</div><div class="meta">of league ${p.def_basis === 'mean' ? 'avg' : p.def_basis === 'per-minute' ? 'per-minute rate' : 'typical game'} allowed${p.def_factor > 1.2 || p.def_factor < 0.8 ? ' · model caps at ±20%' : ''}</div></div>

// ---- parlay slip
function addLeg(p, side){
  slip = slip.filter(l => l.id !== p.id);
  slip.push({id: p.id, player: p.player, label: p.label, market: p.market, line: p.line, side, game: p.game, team: p.team,
    price: side === 'Over' ? p.over : p.under, prob: side === 'Over' ? p.p_over : 1 - p.p_over});
  saveSlip(); $('#slip').classList.add('open');
}
function saveSlip(){ localStorage.setItem(SK('slip'), JSON.stringify(slip)); renderSlip(); }
function renderSlip(){
  $('#slipCount').textContent = `${slip.length} leg${slip.length === 1 ? '' : 's'}`;
  $('#legs').innerHTML = slip.map((l, i) => `<div class="leg"><span><b>${l.player}</b> ${l.side} ${l.line} ${l.label} <span style="color:var(--ink3)">${fmtOdds(l.price)}</span></span>
    <span><span class="num">${pct(l.prob)}</span> <button class="x" data-i="${i}" aria-label="remove">×</button></span></div>`).join('');
  $('#legs').querySelectorAll('.x').forEach(b => b.onclick = () => { slip.splice(+b.dataset.i, 1); saveSlip(); });
  if (!slip.length) { $('#slipOdds').textContent = ''; $('#slipSum').innerHTML = ''; $('#corr').textContent = ''; return; }
  const legsWithPrice = slip.filter(l => l.price != null);
  const d = legsWithPrice.reduce((a, l) => a * dec(l.price), 1);
  const prob = slip.reduce((a, l) => a * l.prob, 1);
  const fair = 1 / prob;
  const ev = prob * (d - 1) - (1 - prob);
  const american = d >= 2 ? '+' + Math.round((d - 1) * 100) : '' + Math.round(-100 / (d - 1));
  $('#slipOdds').textContent = legsWithPrice.length === slip.length ? american : '';
  $('#slipSum').innerHTML = `<span>Book odds <b>${american}</b></span><span>Model prob <b>${pct(prob)}</b></span><span>Fair odds <b>${fair >= 2 ? '+' + Math.round((fair - 1) * 100) : Math.round(-100 / (fair - 1))}</b></span><span>EV <b class="${ev > 0 ? 'pos' : 'neg'}">${(ev * 100).toFixed(1)}%</b></span><span>$10 pays <b>$${(10 * d).toFixed(2)}</b></span><button class="chip" id="clear">clear</button><button class="chip gold" id="saveParlay">${savedSig === slipSig() ? 'Saved ✓' : 'Save parlay'}</button>`;
  $('#clear').onclick = () => { slip = []; saveSlip(); };
  $('#saveParlay').disabled = savedSig === slipSig();
  $('#saveParlay').onclick = e => { e.stopPropagation(); saveParlay(e.currentTarget); };
  const games = {}; slip.forEach(l => (games[l.game] = games[l.game] || []).push(l));
  const sg = Object.values(games).filter(g => g.length > 1);
  $('#corr').textContent = sg.length ? `⚠ ${sg.map(g => g.length).join('+')} legs share a game — the model prob treats legs as independent; same-game legs are correlated and books price that in.` : '';
}

function correctionsHTML(R){
  const bw = (R.backtest_weeks || []).filter(w => typeof w !== 'number' || w >= 5);
  const rows = Object.entries(R.corrections || {}).map(([m, c]) => `<tr><td>${(DATA && DATA.markets[m]) || m}</td>
    <td class="num" title="${c.n_backtest ?? 0} backtest + ${c.n_graded ?? 0} graded props">${c.n}</td>
    <td class="num">${c.bias != null ? (c.bias > 0 ? '+' : '') + c.bias : '—'}</td>
    <td class="num">${c.proj_mult != null ? '×' + c.proj_mult.toFixed(3) : '—'}</td>
    <td class="num">${c.sd_mult != null ? '×' + c.sd_mult.toFixed(3) : '—'}</td>
    <td style="text-align:left">${c.proj_mult == null ? `<span class="muted">${c.note || 'not enough data'}</span>` : c.active ? '<span class="badge won">✓ applied</span>' : `<span class="badge pending">suggested · ${c.n}/${R.corrections_min_n || 100}</span>`}</td></tr>`).join('');
  return `<div class="sec">Model corrections</div>
    <div class="why"><ul>
      <li><b>Projection ×</b> scales every projection in that market (total actual ÷ total projected). Below 1 means the model has been projecting too high.</li>
      <li><b><span class="nc">σ</span> ×</b> widens or narrows the spread. Above 1 means real outcomes vary more than the model thinks, so its probabilities are too confident.</li>
      <li><b>Where they come from:</b> ${bw.length ? `a backtest of ${R.backtest_label ? R.backtest_label : `weeks ${bw[0]}–${bw[bw.length - 1]}`} (the model replayed each ${R.period === 'day' ? 'slate' : 'week'} using only earlier games, for every player with a likely prop)` : 'a backtest of finished weeks'} plus every graded prop. Lines aren't needed, just projection, σ and the actual result. Unflagged projections only, measured against the uncorrected model, and shrunk toward ×1 when the sample is small.</li>
      <li><b>When they apply:</b> automatically, per market, once ${R.corrections_min_n || 100}+ projections back it. They update every build as more weeks finish.</li>
    </ul></div>
    <table class="log"><tr><th>Market</th><th>Projections</th><th>Avg miss</th><th>Projection ×</th><th><span class="nc">σ</span> ×</th><th style="text-align:left">Status</th></tr>${rows}</table>`;
}

// predicted vs actual, one dot per P(over) decile, with the perfect-calibration diagonal
function calibrationChart(cal){
  const pts = cal.filter(c => c.n && c.predicted != null);
  if (!pts.length) return '';
  const W = 520, H = 300, L = 66, R_ = 22, T = 12, B = 40;
  const x = v => L + v * (W - L - R_), y = v => T + (1 - v) * (H - T - B);
  const ticks = [0, 0.25, 0.5, 0.75, 1];
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R_}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/>
    <text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--ink3)">${t * 100}%</text>
    <text x="${x(t)}" y="${H - B + 18}" text-anchor="middle" font-size="11" fill="var(--ink3)">${t * 100}%</text>`).join('');
  const path = pts.map((c, i) => `${i ? 'L' : 'M'}${x(c.predicted).toFixed(1)},${y(c.actual).toFixed(1)}`).join(' ');
  const dots = pts.map((c, i) => `<g class="cal-pt" data-i="${cal.indexOf(c)}">
      <circle cx="${x(c.predicted)}" cy="${y(c.actual)}" r="14" fill="transparent"/>
      <circle cx="${x(c.predicted)}" cy="${y(c.actual)}" r="5" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"/></g>`).join('');
  return `<div class="panel chart-panel"><svg class="calchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration: predicted over probability vs actual over rate by decile">
      ${grid}
      <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--ink3)" stroke-dasharray="4 4"/>
      <text x="${x(0.98)}" y="${y(0.6)}" text-anchor="end" font-size="11" fill="var(--ink3)">dashed = perfect calibration</text>
      <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2" opacity=".55"/>
      ${dots}
      <text x="${(L + W - R_) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink2)">Model's P(over)</text>
      <text transform="translate(12 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink2)">Actual over rate</text>
    </svg>
    <div class="muted small">Dots above the dashed line: overs hit more often than predicted. Below it: less often. Buckets with few props are noisy.</div></div>`;
}
function wireCalibration(){
  const tip = $('#tip'), cal = (RESULTS && RESULTS.calibration) || [];
  document.querySelectorAll('.cal-pt').forEach(g => {
    const c = cal[+g.dataset.i];
    g.onmousemove = e => { tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px';
      tip.textContent = `P(over) ${c.bucket}: predicted ${pct(c.predicted)}, actual ${pct(c.actual)} · ${c.n} props`; };
    g.onmouseleave = () => tip.style.display = 'none';
  });
}

const LEG_ICON = {hit: ['✓', 'won', 'hit'], miss: ['✗', 'lost', 'miss'], push: ['=', 'push', 'push'], void: ['∅', 'push', 'void (DNP)'], pending: ['…', 'pending', 'pending'], unknown: ['?', 'pending', 'unknown']};
const ST_ICON = {won: '✓ Won', lost: '✗ Lost', push: '= Push', pending: '… Pending', saved: '✓ Saved · grades after next build'};
function renderParlays(P){
  const setup = !PARLAY_WEBHOOK_URL || !P.configured || P.error;
  const help = setup ? `<div class="panel"><h3>Set up saved parlays</h3><p class="muted">Saving and grading both go through the Google Apps Script web app on your sheet (<code>docs/parlay-sheet.gs</code>). See <b>README → Saved parlays</b>.</p>
    <ul class="muted small"><li>Site → sheet: ${PARLAY_WEBHOOK_URL ? '✓ <code>PARLAY_WEBHOOK_URL</code> is set' : '✗ <code>PARLAY_WEBHOOK_URL</code> in <code>site/index.html</code> is empty'}</li>
    <li>Sheet → grading: ${P.error ? `✗ the last build couldn't read the sheet: <i>${P.error}</i>` : P.configured ? '✓ the build reads the sheet back from the web app as CSV' : '✗ <code>PARLAY_SHEET_CSV_URL</code> is not set in the workflow'}</li></ul></div>` : '';
  // parlays saved from this browser that the last build hasn't picked up yet
  const known = new Set((P.parlays || []).map(x => x.id));
  let local = [];
  try { local = JSON.parse(localStorage.getItem(SK('savedParlays')) || '[]').filter(x => !known.has(x.id)); localStorage.setItem(SK('savedParlays'), JSON.stringify(local)); } catch (e) {}
  const ps = [...local, ...(P.parlays || [])], s = P.summary || {};
  if (!ps.length) return help + `<div class="empty">No saved parlays yet. Build a slip on the board and press <b>Save parlay</b>.</div>`;
  const settled = s.w + s.l + s.p;
  return help + `
    <div class="grid">
      <div class="tile"><span class="k">Record</span><div class="v">${s.w}–${s.l}${s.p ? '–' + s.p : ''}</div><div class="meta">${s.pending ? s.pending + ' pending' : 'all settled'}</div></div>
      <div class="tile"><span class="k">Units</span><div class="v ${signCls(s.units)}">${unitsTxt(s.units)}</div><div class="meta">1u per parlay at saved odds</div></div>
      <div class="tile"><span class="k">ROI</span><div class="v ${signCls(s.units)}">${settled ? ((s.units / settled) * 100 > 0 ? '+' : '') + ((s.units / settled) * 100).toFixed(1) + '%' : '—'}</div><div class="meta">${settled} settled</div></div>
    </div>
    ${ps.map(p => `<div class="pcard">
      <div class="phead"><span><span class="badge ${p.status === 'saved' ? 'pending' : p.status}">${ST_ICON[p.status] || p.status}</span>
        <b>${p.legs.length}-leg</b> · ${NBA ? '' : 'wk '}${p.week ?? '?'} · ${p.created ? new Date(p.created).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : ''}</span>
        <span class="num">${p.book_odds != null ? fmtOdds(Math.round(p.book_odds)) : '—'} · model ${pct(p.model_prob)} · <b class="${signCls(p.units)}">${p.units != null ? unitsTxt(p.units) : '—'}</b></span></div>
      ${p.legs.map(l => { const [ic, cls, word] = LEG_ICON[l.status] || LEG_ICON.unknown;
        return `<div class="pleg"><span class="badge ${cls}" title="${word}">${ic}</span>

          <span class="num muted">${l.actual != null ? 'actual ' + l.actual : word}${l.price != null ? ' · ' + fmtOdds(l.price) : ''}</span></div>`; }).join('')}

}

// ---- save the current slip to the Parlays sheet
async function saveParlay(btn){
  if (!PARLAY_WEBHOOK_URL) { alert('Saving parlays is not set up yet: put your Google Apps Script web-app URL in PARLAY_WEBHOOK_URL in site/index.html (see README → Saved parlays).'); return; }
  const legs = slip.map(l => ({prop_id: l.id, player: l.player, market: l.market || l.id.split(':')[1], line: l.line,
    side: l.side, price: l.price ?? null, model_prob: l.prob != null ? +l.prob.toFixed(4) : null}));
  const priced = slip.every(l => l.price != null);
  const d = slip.reduce((a, l) => a * (l.price != null ? dec(l.price) : 1), 1);
  const payload = {created: new Date().toISOString(), week: NBA ? DATA.slate_num : DATA.week, legs,
    book_odds: priced ? Math.round(d >= 2 ? (d - 1) * 100 : -100 / (d - 1)) : null,
    model_prob: +slip.reduce((a, l) => a * l.prob, 1).toFixed(4)};
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    // text/plain keeps this a "simple" request (no CORS preflight, which Apps Script can't answer)
    const r = await fetch(PARLAY_WEBHOOK_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'not saved');
    btn.textContent = `Saved ✓ ${j.id}`;
    try {   // show it on the Parlays tab right away; the next build replaces it with the graded copy
      const mine = JSON.parse(localStorage.getItem(SK('savedParlays')) || '[]');
      mine.unshift({id: j.id, created: payload.created, week: payload.week, book_odds: payload.book_odds, model_prob: payload.model_prob,
        status: 'saved', units: null, legs: legs.map(l => ({...l, status: 'pending'}))});
      localStorage.setItem(SK('savedParlays'), JSON.stringify(mine.slice(0, 50)));
    } catch (e) {}
    savedSig = slipSig();
    PARLAYS = null;
  } catch (e) {
    // don't auto-retry: the row may have been written even if we couldn't read the reply
    btn.textContent = 'Not confirmed';
    btn.disabled = false;
    alert(`Couldn't confirm the save (${e.message}). Check the Parlays sheet before trying again so you don't save it twice.`);
  }
}
let savedSig = null;
const slipSig = () => slip.map(l => l.id + l.side + l.line).join('|');

load().catch(e => { $('#meta').textContent = `Could not load ${BASE}props.json — run the ${NBA ? 'NBA ' : ''}pipeline first.`; console.error(e); });
</script>
</body>
</html>
